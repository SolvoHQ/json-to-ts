<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#11172b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Title -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">
    <text x="80" y="160" font-size="84" fill="#78dce8">JSON</text>
    <text x="316" y="160" font-size="84" fill="#8a93b8">→</text>
    <text x="408" y="160" font-size="84" fill="#c792ea">TypeScript</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="220" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="30" fill="#e6ecff">paste JSON, get TS types instantly</text>
  <text x="80" y="262" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#8a93b8">runs in your browser · no signup · no upload</text>

  <!-- Two-pane mockup -->
  <g transform="translate(80,310)">
    <!-- left pane -->
    <rect x="0" y="0" width="500" height="260" rx="12" fill="#0e1424" stroke="#1e2740" stroke-width="2"/>
    <text x="20" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8a93b8">JSON INPUT</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#e6ecff">
      <text x="20" y="78">{</text>
      <text x="44" y="108"><tspan fill="#a6e3a1">"id"</tspan>: <tspan fill="#e0a458">1</tspan>,</text>
      <text x="44" y="138"><tspan fill="#a6e3a1">"name"</tspan>: <tspan fill="#a6e3a1">"Alice"</tspan>,</text>
      <text x="44" y="168"><tspan fill="#a6e3a1">"posts"</tspan>: [{</text>
      <text x="68" y="198"><tspan fill="#a6e3a1">"title"</tspan>: <tspan fill="#a6e3a1">"hi"</tspan></text>
      <text x="44" y="228">}]</text>
      <text x="20" y="244">}</text>
    </g>

    <!-- arrow -->
    <text x="520" y="155" font-family="ui-monospace, Menlo, monospace" font-size="60" fill="#78dce8" font-weight="700">→</text>

    <!-- right pane -->
    <rect x="540" y="0" width="500" height="260" rx="12" fill="#0e1424" stroke="#1e2740" stroke-width="2"/>
    <text x="560" y="32" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#8a93b8">TYPESCRIPT OUTPUT</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="20">
      <text x="560" y="78"><tspan fill="#c792ea">interface</tspan> <tspan fill="#78dce8">Root</tspan> {</text>
      <text x="584" y="108"><tspan fill="#e6ecff">id</tspan>: <tspan fill="#e0a458">number</tspan>;</text>
      <text x="584" y="138"><tspan fill="#e6ecff">name</tspan>: <tspan fill="#e0a458">string</tspan>;</text>
      <text x="584" y="168"><tspan fill="#e6ecff">posts</tspan>: <tspan fill="#78dce8">Post</tspan>[];</text>
      <text x="560" y="198">}</text>
      <text x="560" y="228"><tspan fill="#c792ea">interface</tspan> <tspan fill="#78dce8">Post</tspan> { <tspan fill="#e6ecff">title</tspan>: <tspan fill="#e0a458">string</tspan>; }</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="80" y="600" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#78dce8">json-to-ts-app.netlify.app</text>
</svg>
